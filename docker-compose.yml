services:
  mysql:
    image: mysql:8.0
    container_name: nesc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: nesc_db
      TZ: Europe/Minsk
    ports:
      - "3307:3306"
    volumes:
      - ./init_sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+03:00
    networks:
      - nesc-network

  backend:
    build: ./backend
    container_name: nesc-backend
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123456
      DB_NAME: nesc_db
      JWT_SECRET: nesc_secret_key_2026
      JWT_EXPIRES_IN: 24h
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    networks:
      - nesc-network

  frontend:
    build:
      context: ./infront-react
      args:
        VITE_APP_TITLE: Network Store Inventory Management System
    container_name: nesc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nesc-network

networks:
  nesc-network:
    driver: bridge

volumes:
  mysql_data:
